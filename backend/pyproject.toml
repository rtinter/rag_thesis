[project]
name = "advanced-rag-backend"
version = "0.1.0"
description = "RAG backend (FastAPI): hybrid retrieval + reranker + gateway LLM"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "openai>=2.38.0",
    "qdrant-client>=1.18.0",
    "fastembed>=0.4.0",
    "sentence-transformers>=5.5.1",
    "torch",
    "httpx>=0.27",
]


[dependency-groups]
dev = ["pytest>=8.0"]


# Windows only: PyPI ships CPU-only torch for Windows; CUDA builds live on a
# separate PyTorch index. Linux and macOS get a suitable build from PyPI directly.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
