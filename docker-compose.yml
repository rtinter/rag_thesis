services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ./backend
      args:
        TORCH_VARIANT: cpu
    image: rag_thesis_app-backend:cpu
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - qdrant_url=http://qdrant:6333
      - HF_HOME=/hf_cache
      - slides_dir=/data/reference_slides
      - top_k=25 # adjust here if on CPU and still want to try higher numbers for better results. Thesis and GPU setup uses 100
    volumes:
      - ./data/reference_slides:/data/reference_slides:ro
      - hf_cache:/hf_cache
    depends_on:
      - qdrant

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  hf_cache:
