[project]
name = "advanced-rag-thesis"
version = "0.1.0"
description = "Todo: Add a description "
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "docling",
    "torch",
    "torchvision",
    "torchaudio",
    "openai>=2.38.0",
    "tiktoken>=0.13.0",
    "pymupdf>=1.27.2.3",
    "qdrant-client>=1.18.0",
    "fastembed>=0.4.0",
    "sentence-transformers>=5.5.1",
    "rapidfuzz>=3.14.5",
    "ipywidgets>=8.1.8",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
]

# Windows-only: PyPI only hosts CPU builds of PyTorch on Windows.
# CUDA builds are hosted on a separate PyTorch index.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
